<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="t d">
  <title id="t">FIM lab architecture</title>
  <desc id="d">Your computer connects to three cloud VMs in one private network. wazuh-server runs the Wazuh dashboard, indexer, Filebeat and manager. ubuntu-endpoint runs auditd and the Wazuh agent, which watches system folders in who-data mode. windows-endpoint runs the Wazuh agent, which watches folders in who-data mode and scans registry keys every 5 minutes. Both agents send events to the manager on 1514/tcp after enrolling on 1515/tcp.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .halo { paint-order: stroke; stroke: #f0f6ff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="898" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="48" font-size="24" font-weight="700">FIM lab architecture</text>
  <text x="40" y="74" font-size="14" fill="#57606a">Wazuh 4.14 all-in-one server with one Ubuntu and one Windows endpoint, all cloud VMs</text>

  <!-- ============ YOUR COMPUTER ============ -->
  <rect x="30" y="280" width="220" height="200" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="140" y="310" font-size="16" font-weight="700" text-anchor="middle">Your computer</text>
  <text x="140" y="332" font-size="12" text-anchor="middle" class="mono" fill="#57606a">&lt;YOUR_PUBLIC_IP&gt;</text>
  <rect x="50" y="350" width="180" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="140" y="371" font-size="13.5" font-weight="600" text-anchor="middle">Web browser</text>
  <text x="140" y="389" font-size="11.5" text-anchor="middle" fill="#57606a">opens the dashboard (HTTPS)</text>
  <rect x="50" y="410" width="180" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="140" y="431" font-size="13.5" font-weight="600" text-anchor="middle">SSH and Remote Desktop</text>
  <text x="140" y="449" font-size="11.5" text-anchor="middle" fill="#57606a">admin access to the VMs</text>

  <!-- ============ CLOUD ============ -->
  <rect x="290" y="100" width="960" height="730" rx="18" fill="#f0f6ff" stroke="#54aeff" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="126" font-size="14" font-weight="700" fill="#0969da">Cloud provider · one VPC / private network</text>

  <!-- ============ WAZUH SERVER VM ============ -->
  <rect x="320" y="145" width="440" height="575" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="340" y="175" font-size="18" font-weight="700">wazuh-server</text>
  <text x="340" y="197" font-size="12.5" fill="#57606a">Ubuntu 22.04 · 4 vCPU · 8 GB RAM · 50 GB disk</text>
  <text x="340" y="216" font-size="12" class="mono" fill="#57606a">private IP: &lt;WAZUH_SERVER_PRIVATE_IP&gt;</text>

  <rect x="350" y="235" width="380" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="262" font-size="15" font-weight="700" text-anchor="middle">Wazuh dashboard</text>
  <text x="540" y="285" font-size="12.5" text-anchor="middle">web interface · 443/tcp (HTTPS)</text>

  <rect x="350" y="335" width="380" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="362" font-size="15" font-weight="700" text-anchor="middle">Wazuh indexer</text>
  <text x="540" y="385" font-size="12.5" text-anchor="middle">stores and searches alerts · 9200/tcp (local only)</text>

  <rect x="350" y="435" width="380" height="50" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="456" font-size="14" font-weight="700" text-anchor="middle">Filebeat</text>
  <text x="540" y="475" font-size="12" text-anchor="middle">ships alerts to the indexer (TLS)</text>

  <rect x="350" y="515" width="380" height="185" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="542" font-size="15" font-weight="700" text-anchor="middle">Wazuh manager (server)</text>
  <text x="372" y="567" font-size="12.5">• 1515/tcp agent enrollment, 1514/tcp events</text>
  <text x="372" y="589" font-size="12.5">• pushes agent.conf: one block for Linux,</text>
  <text x="384" y="609" font-size="12.5">one block for Windows</text>
  <text x="372" y="631" font-size="12.5">• file rules 550 / 553 / 554</text>
  <text x="372" y="653" font-size="12.5">• registry rules 594, 597, 598, 750, 751, 752</text>
  <text x="372" y="675" font-size="12.5">• package (dpkg) rules 2901 to 2904</text>

  <line x1="540" y1="515" x2="540" y2="489" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="552" y="506" font-size="11.5" fill="#0969da">alerts</text>
  <line x1="540" y1="435" x2="540" y2="409" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="552" y="426" font-size="11.5" fill="#0969da">index</text>
  <line x1="540" y1="331" x2="540" y2="309" stroke="#0969da" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="552" y="326" font-size="11.5" fill="#0969da">search</text>

  <!-- ============ UBUNTU ENDPOINT ============ -->
  <rect x="920" y="145" width="310" height="320" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="940" y="172" font-size="18" font-weight="700">ubuntu-endpoint</text>
  <text x="940" y="192" font-size="12" fill="#57606a">Ubuntu 22.04 · 1–2 vCPU · 2 GB · 20 GB</text>
  <text x="940" y="209" font-size="11.5" class="mono" fill="#57606a">private IP: &lt;ENDPOINT_PRIVATE_IP&gt;</text>

  <rect x="940" y="222" width="270" height="104" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="1075" y="242" font-size="13" font-weight="700" text-anchor="middle">Watched in real time (who-data)</text>
  <text x="1075" y="262" font-size="11.5" text-anchor="middle" class="mono">/etc · /root/.ssh · /home/*/.ssh</text>
  <text x="1075" y="279" font-size="11.5" text-anchor="middle" class="mono">/usr/bin · /usr/sbin</text>
  <text x="1075" y="296" font-size="11.5" text-anchor="middle" class="mono">/usr/local/bin · /usr/local/sbin</text>
  <text x="1075" y="313" font-size="11.5" text-anchor="middle" class="mono">/var/spool/cron · /opt/fim-lab</text>

  <rect x="940" y="336" width="270" height="38" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="1075" y="360" font-size="12.5" text-anchor="middle"><tspan font-weight="700">auditd</tspan>: who changed a file, and how</text>

  <rect x="940" y="386" width="270" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1075" y="410" font-size="14.5" font-weight="700" text-anchor="middle">Wazuh agent</text>
  <text x="1075" y="432" font-size="12" text-anchor="middle">FIM (who-data) + /var/log/dpkg.log</text>

  <line x1="1075" y1="326" x2="1075" y2="333" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <line x1="1075" y1="374" x2="1075" y2="383" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- ============ WINDOWS ENDPOINT ============ -->
  <rect x="920" y="490" width="310" height="320" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="940" y="517" font-size="18" font-weight="700">windows-endpoint</text>
  <text x="940" y="537" font-size="12" fill="#57606a">Windows Server 2022 · 2 vCPU · 4 GB · 50 GB</text>
  <text x="940" y="554" font-size="11.5" class="mono" fill="#57606a">private IP: &lt;WINDOWS_PRIVATE_IP&gt;</text>

  <rect x="940" y="567" width="270" height="86" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="1075" y="587" font-size="13" font-weight="700" text-anchor="middle">Folders (who-data or 5-min scan)</text>
  <text x="1075" y="607" font-size="11.5" text-anchor="middle" class="mono">C:\fim-lab · Startup folders</text>
  <text x="1075" y="624" font-size="11.5" text-anchor="middle" class="mono">C:\Users\*\Downloads</text>
  <text x="1075" y="641" font-size="11.5" text-anchor="middle" class="mono">drivers\etc · System32\Tasks</text>

  <rect x="940" y="663" width="270" height="70" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="1075" y="683" font-size="13" font-weight="700" text-anchor="middle">Registry keys (5-min scan)</text>
  <text x="1075" y="703" font-size="11.5" text-anchor="middle">Run, RunOnce, Services, Winlogon,</text>
  <text x="1075" y="720" font-size="11.5" text-anchor="middle">IFEO, Lsa, Terminal Server, FimLab</text>

  <rect x="940" y="743" width="270" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1075" y="765" font-size="14.5" font-weight="700" text-anchor="middle">Wazuh agent</text>
  <text x="1075" y="785" font-size="12" text-anchor="middle">FIM: files + registry</text>

  <line x1="1075" y1="653" x2="1075" y2="660" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1075" y1="733" x2="1075" y2="740" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ============ AGENTS -> MANAGER ============ -->
  <polyline points="938,418 820,418 820,600 734,600" fill="none" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="879" y="410" font-size="12" font-weight="700" text-anchor="middle" fill="#1a7f37" class="halo">1514 + 1515/tcp</text>
  <polyline points="938,770 880,770 880,660 734,660" fill="none" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="828" y="652" font-size="12" font-weight="700" text-anchor="middle" fill="#1a7f37" class="halo">1514 + 1515/tcp</text>

  <!-- ============ YOUR COMPUTER -> VMs ============ -->
  <polyline points="230,374 302,374 302,270 346,270" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="366" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a">HTTPS 443</text>
  <line x1="230" y1="434" x2="316" y2="434" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a">SSH 22</text>
  <polyline points="140,280 140,92 1075,92 1075,141" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a">SSH 22 (key only)</text>
  <polyline points="140,480 140,850 1075,850 1075,814" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="843" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a" class="halo">Remote Desktop (RDP) 3389</text>

  <text x="40" y="880" font-size="13" fill="#57606a">Never opened in any firewall: 9200 (indexer) and 55000 (server API).   The agents open their connections themselves (outbound).</text>
</svg>
