<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="t d">
  <title id="t">From event to investigation</title>
  <desc id="d">Seven stages of one failed SSH login in this lab: endpoint, log event, Wazuh agent, Wazuh manager decoder, detection rule, alert, investigation, with the real data seen at each stage.</desc>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .stage { font-size: 17px; font-weight: 700; }
      .sub { font-size: 12.5px; fill: #3d444d; }
      .ex { font-size: 13.5px; }
      .exm { font-size: 13px; }
      .note { font-size: 12px; fill: #57606a; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="898" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="48" font-size="24" font-weight="700">From event to investigation</text>
  <text x="40" y="74" font-size="14" fill="#57606a">The path of one failed SSH login in this lab (the brute-force test in Step 14). Example values; your IPs and times will differ.</text>

  <!-- column headers -->
  <text x="40" y="106" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1">STAGE</text>
  <text x="330" y="106" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1">WHAT IT LOOKS LIKE IN THIS LAB</text>

  <!-- ===== 1 Endpoint ===== -->
  <rect x="40" y="118" width="260" height="84" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="68" cy="146" r="14" fill="#1a7f37"/><text x="68" y="151" text-anchor="middle" class="num">1</text>
  <text x="92" y="152" class="stage">Endpoint</text>
  <text x="56" y="182" class="sub">ubuntu-endpoint, the monitored VM</text>
  <rect x="330" y="118" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="148" class="ex">Someone tries to log in over SSH as a user that does not exist:</text>
  <text x="350" y="176" class="exm mono">ssh badguy@10.0.1.20</text>
  <text x="560" y="176" class="note">(sent from wazuh-server, 10.0.1.10, by scripts/ssh-bruteforce-sim.sh)</text>

  <line x1="170" y1="202" x2="170" y2="226" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>

  <!-- ===== 2 Log / Event ===== -->
  <rect x="40" y="230" width="260" height="84" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <circle cx="68" cy="258" r="14" fill="#57606a"/><text x="68" y="263" text-anchor="middle" class="num">2</text>
  <text x="92" y="264" class="stage">Log / Event</text>
  <text x="56" y="294" class="sub">sshd writes one line to journald</text>
  <rect x="330" y="230" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="260" class="exm mono">sshd[2481]: Invalid user badguy from 10.0.1.10 port 50522</text>
  <text x="350" y="290" class="note">One event = one line of log text. On its own it is just a record, not an alert.</text>

  <line x1="170" y1="314" x2="170" y2="338" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>

  <!-- ===== 3 Wazuh agent ===== -->
  <rect x="40" y="342" width="260" height="84" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="68" cy="370" r="14" fill="#1a7f37"/><text x="68" y="375" text-anchor="middle" class="num">3</text>
  <text x="92" y="376" class="stage">Wazuh agent</text>
  <text x="56" y="406" class="sub">logcollector reads journald</text>
  <rect x="330" y="342" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="372" class="ex">The agent picks up the new line and forwards it to the manager</text>
  <text x="350" y="400" class="ex">over <tspan class="mono" font-weight="700">1514/tcp</tspan>, encrypted with AES. It does not decide anything itself.</text>

  <line x1="170" y1="426" x2="170" y2="450" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>

  <!-- ===== 4 Wazuh manager ===== -->
  <rect x="40" y="454" width="260" height="84" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="68" cy="482" r="14" fill="#0969da"/><text x="68" y="487" text-anchor="middle" class="num">4</text>
  <text x="92" y="488" class="stage">Wazuh manager</text>
  <text x="56" y="518" class="sub">decoder turns text into fields</text>
  <rect x="330" y="454" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="484" class="exm mono">decoder: sshd · srcip: 10.0.1.10 · srcuser: badguy · srcport: 50522</text>
  <text x="350" y="514" class="note">Pre-decoding finds the program name (sshd); the sshd decoder pulls out the fields rules can use.</text>

  <line x1="170" y1="538" x2="170" y2="562" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>

  <!-- ===== 5 Detection rule ===== -->
  <rect x="40" y="566" width="260" height="84" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <circle cx="68" cy="594" r="14" fill="#8250df"/><text x="68" y="599" text-anchor="middle" class="num">5</text>
  <text x="92" y="600" class="stage">Detection rule</text>
  <text x="56" y="630" class="sub">rules test the decoded fields</text>
  <rect x="330" y="566" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="596" class="ex"><tspan font-weight="700">Rule 5710</tspan> (level 5): "sshd: Attempt to login using a non-existent user"</text>
  <text x="350" y="624" class="ex"><tspan font-weight="700">Rule 5712</tspan> (level 10): 5710 seen 8 times from the same srcip within 120 s = brute force</text>

  <line x1="170" y1="650" x2="170" y2="674" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>

  <!-- ===== 6 Alert ===== -->
  <rect x="40" y="678" width="260" height="84" rx="12" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <circle cx="68" cy="706" r="14" fill="#bc4c00"/><text x="68" y="711" text-anchor="middle" class="num">6</text>
  <text x="92" y="712" class="stage">Alert</text>
  <text x="56" y="742" class="sub">saved, indexed, shown</text>
  <rect x="330" y="678" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="708" class="ex">Level 3 or higher, so it is written to <tspan class="mono">/var/ossec/logs/alerts/alerts.json</tspan></text>
  <text x="350" y="736" class="ex">→ Filebeat → Wazuh indexer (<tspan class="mono">wazuh-alerts-*</tspan>) → Wazuh dashboard. MITRE: T1110.</text>

  <line x1="170" y1="762" x2="170" y2="786" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>

  <!-- ===== 7 Investigation ===== -->
  <rect x="40" y="790" width="260" height="84" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <circle cx="68" cy="818" r="14" fill="#cf222e"/><text x="68" y="823" text-anchor="middle" class="num">7</text>
  <text x="92" y="824" class="stage">Investigation</text>
  <text x="56" y="854" class="sub">the analyst decides what it means</text>
  <rect x="330" y="790" width="730" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="820" class="ex"><tspan font-weight="700">Where from?</tspan> agent.name, full_log  ·  <tspan font-weight="700">Why?</tspan> rule.id, rule.description</text>
  <text x="350" y="848" class="ex"><tspan font-weight="700">What does it mean?</tspan> rule.level, rule.mitre  ·  <tspan font-weight="700">Act?</tspan> data.srcip, count, any later success?</text>
</svg>
