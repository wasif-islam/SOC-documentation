<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a Wazuh alert</title>
  <desc id="d">A shortened rule 5712 SSH brute-force alert in JSON, with its fields colour-coded by the four investigation questions: where did it come from, why was it generated, what does it mean, and does it need action.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .j { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12.5px; white-space: pre; }
      .h { font-size: 16px; font-weight: 700; }
      .f { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; }
      .b { font-size: 13px; fill: #3d444d; }
    </style>
  </defs>

  <rect x="1" y="1" width="1238" height="798" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="48" font-size="24" font-weight="700">Anatomy of an alert</text>
  <text x="40" y="74" font-size="14" fill="#57606a">A shortened rule 5712 alert (SSH brute force) as stored in alerts.json. Each colour answers one investigation question.</text>

  <!-- JSON panel -->
  <rect x="40" y="96" width="640" height="672" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- highlight rows: y = baseline - 15, height 21 -->
  <!-- blue = where -->
  <g fill="#ddf4ff">
    <rect x="48" y="133" width="624" height="21"/>
    <rect x="48" y="448" width="624" height="21"/>
    <rect x="48" y="469" width="624" height="21"/>
    <rect x="48" y="490" width="624" height="21"/>
    <rect x="48" y="511" width="624" height="21"/>
    <rect x="48" y="574" width="624" height="21"/>
    <rect x="48" y="595" width="624" height="21"/>
    <rect x="48" y="721" width="624" height="21"/>
  </g>
  <g fill="#0969da">
    <rect x="48" y="133" width="4" height="21"/>
    <rect x="48" y="448" width="4" height="84"/>
    <rect x="48" y="574" width="4" height="42"/>
    <rect x="48" y="721" width="4" height="21"/>
  </g>
  <!-- purple = why -->
  <g fill="#fbefff">
    <rect x="48" y="175" width="624" height="21"/>
    <rect x="48" y="196" width="624" height="21"/>
    <rect x="48" y="217" width="624" height="21"/>
    <rect x="48" y="238" width="624" height="21"/>
    <rect x="48" y="616" width="624" height="21"/>
  </g>
  <g fill="#8250df">
    <rect x="48" y="175" width="4" height="84"/>
    <rect x="48" y="616" width="4" height="21"/>
  </g>
  <!-- orange = meaning -->
  <g fill="#fff1e5">
    <rect x="48" y="259" width="624" height="21"/>
    <rect x="48" y="280" width="624" height="21"/>
    <rect x="48" y="322" width="624" height="21"/>
    <rect x="48" y="343" width="624" height="21"/>
    <rect x="48" y="364" width="624" height="21"/>
    <rect x="48" y="385" width="624" height="21"/>
    <rect x="48" y="406" width="624" height="21"/>
  </g>
  <g fill="#bc4c00">
    <rect x="48" y="259" width="4" height="42"/>
    <rect x="48" y="322" width="4" height="105"/>
  </g>
  <!-- red = act -->
  <g fill="#ffebe9">
    <rect x="48" y="658" width="624" height="21"/>
    <rect x="48" y="679" width="624" height="21"/>
  </g>
  <g fill="#cf222e">
    <rect x="48" y="658" width="4" height="42"/>
  </g>

  <!-- JSON text, line height 21, first baseline 127 -->
  <text x="62" y="127" class="j">{</text>
  <text x="62" y="148" class="j">  "timestamp": "2026-10-02T10:15:42.118+0000",</text>
  <text x="62" y="169" class="j">  "rule": {</text>
  <text x="62" y="190" class="j">    "id": "5712",</text>
  <text x="62" y="211" class="j">    "description": "sshd: brute force trying to get access</text>
  <text x="62" y="232" class="j">       to the system. Non existent user.",</text>
  <text x="62" y="253" class="j">    "firedtimes": 1,</text>
  <text x="62" y="274" class="j">    "level": 10,</text>
  <text x="62" y="295" class="j">    "groups": ["syslog", "sshd", "authentication_failures"],</text>
  <text x="62" y="316" class="j">    ... (compliance fields: pci_dss, gdpr, hipaa, nist_800_53 ...)</text>
  <text x="62" y="337" class="j">    "mitre": {</text>
  <text x="62" y="358" class="j">      "id": ["T1110"],</text>
  <text x="62" y="379" class="j">      "tactic": ["Credential Access"],</text>
  <text x="62" y="400" class="j">      "technique": ["Brute Force"]</text>
  <text x="62" y="421" class="j">    }</text>
  <text x="62" y="442" class="j">  },</text>
  <text x="62" y="463" class="j">  "agent": {</text>
  <text x="62" y="484" class="j">    "id": "001",</text>
  <text x="62" y="505" class="j">    "name": "ubuntu-endpoint",</text>
  <text x="62" y="526" class="j">    "ip": "10.0.1.20"</text>
  <text x="62" y="547" class="j">  },</text>
  <text x="62" y="568" class="j">  "manager": { "name": "wazuh-server" },</text>
  <text x="62" y="589" class="j">  "full_log": "Oct  2 10:15:42 ubuntu-endpoint sshd[2481]:</text>
  <text x="62" y="610" class="j">     Invalid user badguy from 10.0.1.10 port 50522",</text>
  <text x="62" y="631" class="j">  "decoder": { "name": "sshd" },</text>
  <text x="62" y="652" class="j">  "data": {</text>
  <text x="62" y="673" class="j">    "srcip": "10.0.1.10",</text>
  <text x="62" y="694" class="j">    "srcuser": "badguy"</text>
  <text x="62" y="715" class="j">  },</text>
  <text x="62" y="736" class="j">  "location": "journald"</text>
  <text x="62" y="757" class="j">}</text>

  <!-- ===== cards ===== -->
  <!-- 1 where -->
  <rect x="710" y="96" width="490" height="156" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <rect x="710" y="96" width="8" height="156" rx="4" fill="#0969da"/>
  <text x="734" y="126" class="h" fill="#0969da">1 · Where did it come from?</text>
  <text x="734" y="150" class="f">timestamp · agent.name · agent.ip · full_log · location</text>
  <text x="734" y="178" class="b">Which endpoint sent the event, when, which log source the</text>
  <text x="734" y="198" class="b">agent read, and the original log line. With full_log you can</text>
  <text x="734" y="218" class="b">find the same line on the machine itself (journalctl -u ssh).</text>

  <!-- 2 why -->
  <rect x="710" y="266" width="490" height="156" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <rect x="710" y="266" width="8" height="156" rx="4" fill="#8250df"/>
  <text x="734" y="296" class="h" fill="#8250df">2 · Why was it generated?</text>
  <text x="734" y="320" class="f">rule.id · rule.description · rule.firedtimes · decoder.name</text>
  <text x="734" y="348" class="b">The sshd decoder understood the line and rule 5712 matched.</text>
  <text x="734" y="368" class="b">5712 is a correlation rule: it fires after rule 5710 matched</text>
  <text x="734" y="388" class="b">8 times from the same source IP within 120 seconds.</text>

  <!-- 3 meaning -->
  <rect x="710" y="436" width="490" height="156" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
  <rect x="710" y="436" width="8" height="156" rx="4" fill="#bc4c00"/>
  <text x="734" y="466" class="h" fill="#bc4c00">3 · What does it mean?</text>
  <text x="734" y="490" class="f">rule.level · rule.groups · rule.mitre.id / tactic / technique</text>
  <text x="734" y="518" class="b">Level 10 = multiple failed logins (Medium severity).</text>
  <text x="734" y="538" class="b">MITRE ATT&amp;CK T1110 Brute Force, tactic Credential Access:</text>
  <text x="734" y="558" class="b">someone is guessing usernames or passwords.</text>

  <!-- 4 act -->
  <rect x="710" y="606" width="490" height="162" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
  <rect x="710" y="606" width="8" height="162" rx="4" fill="#cf222e"/>
  <text x="734" y="636" class="h" fill="#cf222e">4 · Does it need action?</text>
  <text x="734" y="660" class="f">data.srcip · data.srcuser</text>
  <text x="734" y="688" class="b">Is the source IP known? Does the user exist? Did any login</text>
  <text x="734" y="708" class="b">succeed from this IP afterwards (rule 5715)? In this lab the</text>
  <text x="734" y="728" class="b">source is wazuh-server running our test script, so it is</text>
  <text x="734" y="748" class="b">expected activity: document it and close it.</text>
</svg>
