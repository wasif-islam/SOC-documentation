<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Lab architecture</title>
  <desc id="d">Your computer connects to two Ubuntu 22.04 cloud VMs in one private network. wazuh-server runs the Wazuh dashboard, indexer, Filebeat and manager. ubuntu-endpoint runs the Wazuh agent, which sends events to the manager on 1514/tcp after enrolling on 1515/tcp.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .haloBlue { paint-order: stroke; stroke: #f0f6ff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="1278" height="798" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- title -->
  <text x="40" y="48" font-size="24" font-weight="700">Lab architecture</text>
  <text x="40" y="74" font-size="14" fill="#57606a">Wazuh 4.14 all-in-one server and one monitored endpoint, both Ubuntu 22.04 cloud VMs</text>

  <!-- ============ YOUR COMPUTER ============ -->
  <rect x="30" y="280" width="220" height="200" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="140" y="310" font-size="16" font-weight="700" text-anchor="middle">Your computer</text>
  <text x="140" y="332" font-size="12" text-anchor="middle" class="mono" fill="#57606a">&lt;YOUR_PUBLIC_IP&gt;</text>
  <rect x="50" y="350" width="180" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="140" y="371" font-size="13.5" font-weight="600" text-anchor="middle">Web browser</text>
  <text x="140" y="389" font-size="11.5" text-anchor="middle" fill="#57606a">opens the dashboard (HTTPS)</text>
  <rect x="50" y="410" width="180" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="140" y="431" font-size="13.5" font-weight="600" text-anchor="middle">Terminal</text>
  <text x="140" y="449" font-size="11.5" text-anchor="middle" fill="#57606a">SSH with your key to both VMs</text>

  <!-- ============ CLOUD ============ -->
  <rect x="290" y="100" width="960" height="640" rx="18" fill="#f0f6ff" stroke="#54aeff" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="126" font-size="14" font-weight="700" fill="#0969da">Cloud provider · one VPC / private network</text>

  <!-- ============ WAZUH SERVER VM ============ -->
  <rect x="320" y="145" width="440" height="575" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="340" y="175" font-size="18" font-weight="700">wazuh-server</text>
  <text x="340" y="197" font-size="12.5" fill="#57606a">Ubuntu 22.04 · 4 vCPU · 8 GB RAM · 50 GB disk</text>
  <text x="340" y="216" font-size="12" class="mono" fill="#57606a">private IP: &lt;WAZUH_SERVER_PRIVATE_IP&gt;</text>

  <!-- dashboard -->
  <rect x="350" y="235" width="380" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="262" font-size="15" font-weight="700" text-anchor="middle">Wazuh dashboard</text>
  <text x="540" y="285" font-size="12.5" text-anchor="middle">web interface · 443/tcp (HTTPS)</text>

  <!-- indexer -->
  <rect x="350" y="335" width="380" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="362" font-size="15" font-weight="700" text-anchor="middle">Wazuh indexer</text>
  <text x="540" y="385" font-size="12.5" text-anchor="middle">stores and searches alerts · 9200/tcp (local only)</text>

  <!-- filebeat -->
  <rect x="350" y="435" width="380" height="50" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="456" font-size="14" font-weight="700" text-anchor="middle">Filebeat</text>
  <text x="540" y="475" font-size="12" text-anchor="middle">ships alerts to the indexer (TLS)</text>

  <!-- manager -->
  <rect x="350" y="515" width="380" height="185" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="542" font-size="15" font-weight="700" text-anchor="middle">Wazuh manager (server)</text>
  <text x="372" y="567" font-size="12.5">• 1515/tcp  agent enrollment</text>
  <text x="372" y="589" font-size="12.5">• 1514/tcp  agent events (encrypted)</text>
  <text x="372" y="611" font-size="12.5">• decoders → rules → alerts</text>
  <text x="372" y="633" font-size="12.5">• alerts saved in /var/ossec/logs/alerts/</text>
  <text x="372" y="655" font-size="12.5">• 55000/tcp server API (local only,</text>
  <text x="384" y="675" font-size="12.5">used by the dashboard)</text>

  <!-- internal arrows -->
  <line x1="540" y1="515" x2="540" y2="489" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="552" y="506" font-size="11.5" fill="#0969da">alerts</text>
  <line x1="540" y1="435" x2="540" y2="409" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="552" y="426" font-size="11.5" fill="#0969da">index</text>
  <line x1="540" y1="331" x2="540" y2="309" stroke="#0969da" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="552" y="326" font-size="11.5" fill="#0969da">search</text>

  <!-- ============ ENDPOINT VM ============ -->
  <rect x="940" y="300" width="280" height="360" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="960" y="330" font-size="18" font-weight="700">ubuntu-endpoint</text>
  <text x="960" y="351" font-size="12" fill="#57606a">Ubuntu 22.04 · 1–2 vCPU · 2 GB · 20 GB</text>
  <text x="960" y="369" font-size="11.5" class="mono" fill="#57606a">private IP: &lt;ENDPOINT_PRIVATE_IP&gt;</text>

  <rect x="960" y="390" width="230" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="1075" y="411" font-size="13" font-weight="700" text-anchor="middle">sshd · 22/tcp</text>
  <text x="1075" y="428" font-size="11.5" text-anchor="middle" fill="#57606a">writes login events to journald</text>

  <rect x="960" y="446" width="230" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="1075" y="467" font-size="13" font-weight="700" text-anchor="middle" class="mono">/opt/fim-lab</text>
  <text x="1075" y="484" font-size="11.5" text-anchor="middle" fill="#57606a">folder watched by FIM</text>

  <rect x="960" y="510" width="230" height="132" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1075" y="536" font-size="15" font-weight="700" text-anchor="middle">Wazuh agent</text>
  <text x="976" y="560" font-size="12">• logcollector reads journald</text>
  <text x="976" y="582" font-size="12">• syscheck = FIM (real time)</text>
  <text x="976" y="604" font-size="12">• sends events to the manager</text>
  <text x="976" y="626" font-size="11.5" font-style="italic" fill="#57606a">outbound only, no open port</text>

  <!-- endpoint internal arrows -->
  <polyline points="1190,413 1206,413 1206,548 1194,548" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="1075" y1="492" x2="1075" y2="506" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ============ AGENT -> MANAGER ============ -->
  <line x1="958" y1="596" x2="734" y2="596" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="846" y="588" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1a7f37" class="halo">1515/tcp enrollment</text>
  <line x1="958" y1="634" x2="734" y2="634" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="846" y="626" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1a7f37" class="halo">1514/tcp events</text>

  <!-- ============ LAB BRUTE-FORCE TEST ============ -->
  <line x1="762" y1="413" x2="956" y2="413" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <text x="858" y="403" font-size="12" font-weight="700" text-anchor="middle" fill="#cf222e" class="halo">SSH brute-force test</text>
  <text x="858" y="432" font-size="11" text-anchor="middle" fill="#cf222e" class="halo">22/tcp, lab only</text>

  <!-- ============ YOUR COMPUTER -> VMs ============ -->
  <!-- HTTPS to dashboard -->
  <polyline points="230,374 302,374 302,270 346,270" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="366" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a" class="halo">HTTPS 443</text>
  <!-- SSH to server -->
  <line x1="230" y1="434" x2="316" y2="434" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a" class="halo">SSH 22</text>
  <!-- SSH to endpoint, routed over the top -->
  <polyline points="140,280 140,92 1080,92 1080,296" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="#57606a">SSH 22 (key only)</text>

  <!-- footer note -->
  <text x="40" y="772" font-size="13" fill="#57606a">Never opened in any firewall: 9200 (indexer) and 55000 (server API) are used only inside wazuh-server.   The agent opens its connections itself (outbound).</text>
</svg>
