<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
  <title id="t">Wazuh rule levels</title>
  <desc id="d">A scale of rule levels 0 to 15 grouped into the dashboard severity bands Low 0 to 6, Medium 7 to 11, High 12 to 14 and Critical 15 and above, with the rules used in this lab placed on the scale. Events matching level 0 to 2 rules are not saved as alerts.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .lvl { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .band { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .pill { font-size: 12.5px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="558" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="48" font-size="24" font-weight="700">Rule levels: how serious is an alert?</text>
  <text x="40" y="74" font-size="14" fill="#57606a">Every Wazuh rule has a level from 0 to 15. Higher means more serious. Bands = severity groups on the dashboard overview.</text>

  <!-- band brackets (cell width 60, scale starts at x=70) -->
  <path d="M72,150 v-10 h416 v10" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <text x="280" y="130" class="band" fill="#1a7f37">Low · 0–6</text>
  <path d="M492,150 v-10 h296 v10" fill="none" stroke="#9a6700" stroke-width="2"/>
  <text x="640" y="130" class="band" fill="#9a6700">Medium · 7–11</text>
  <path d="M792,150 v-10 h176 v10" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="880" y="130" class="band" fill="#bc4c00">High · 12–14</text>
  <path d="M972,150 v-10 h56 v10" fill="none" stroke="#cf222e" stroke-width="2"/>
  <text x="1000" y="130" class="band" fill="#cf222e">Critical · 15</text>

  <!-- scale cells -->
  <g stroke="#ffffff" stroke-width="2">
    <rect x="70"  y="160" width="60" height="60" fill="#eaeef2"/>
    <rect x="130" y="160" width="60" height="60" fill="#eaeef2"/>
    <rect x="190" y="160" width="60" height="60" fill="#eaeef2"/>
    <rect x="250" y="160" width="60" height="60" fill="#aceebb"/>
    <rect x="310" y="160" width="60" height="60" fill="#aceebb"/>
    <rect x="370" y="160" width="60" height="60" fill="#aceebb"/>
    <rect x="430" y="160" width="60" height="60" fill="#aceebb"/>
    <rect x="490" y="160" width="60" height="60" fill="#fae17d"/>
    <rect x="550" y="160" width="60" height="60" fill="#fae17d"/>
    <rect x="610" y="160" width="60" height="60" fill="#fae17d"/>
    <rect x="670" y="160" width="60" height="60" fill="#fae17d"/>
    <rect x="730" y="160" width="60" height="60" fill="#fae17d"/>
    <rect x="790" y="160" width="60" height="60" fill="#ffb77c"/>
    <rect x="850" y="160" width="60" height="60" fill="#ffb77c"/>
    <rect x="910" y="160" width="60" height="60" fill="#ffb77c"/>
    <rect x="970" y="160" width="60" height="60" fill="#ff8182"/>
  </g>
  <text x="100"  y="197" class="lvl" fill="#8c959f">0</text>
  <text x="160"  y="197" class="lvl" fill="#8c959f">1</text>
  <text x="220"  y="197" class="lvl" fill="#8c959f">2</text>
  <text x="280"  y="197" class="lvl">3</text>
  <text x="340"  y="197" class="lvl">4</text>
  <text x="400"  y="197" class="lvl">5</text>
  <text x="460"  y="197" class="lvl">6</text>
  <text x="520"  y="197" class="lvl">7</text>
  <text x="580"  y="197" class="lvl">8</text>
  <text x="640"  y="197" class="lvl">9</text>
  <text x="700"  y="197" class="lvl">10</text>
  <text x="760"  y="197" class="lvl">11</text>
  <text x="820"  y="197" class="lvl">12</text>
  <text x="880"  y="197" class="lvl">13</text>
  <text x="940"  y="197" class="lvl">14</text>
  <text x="1000" y="197" class="lvl">15</text>

  <!-- alert threshold -->
  <line x1="250" y1="150" x2="250" y2="500" stroke="#57606a" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- lab rules: connectors -->
  <g stroke="#8c959f" stroke-width="1.5">
    <line x1="400" y1="220" x2="400" y2="318"/>
    <line x1="520" y1="220" x2="520" y2="388"/>
    <line x1="700" y1="220" x2="700" y2="318"/>
    <line x1="820" y1="220" x2="820" y2="388"/>
  </g>

  <text x="70" y="262" font-size="13" font-weight="700" fill="#57606a">Rules used in this lab:</text>

  <!-- level 5 -->
  <rect x="320" y="318" width="160" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="400" y="336" class="pill"><tspan font-weight="700">554</tspan> file added</text>
  <rect x="320" y="350" width="160" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="400" y="368" class="pill"><tspan font-weight="700">5710</tspan> invalid SSH user</text>

  <!-- level 7 -->
  <rect x="440" y="388" width="160" height="26" rx="13" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="520" y="406" class="pill"><tspan font-weight="700">550</tspan> file modified</text>
  <rect x="440" y="420" width="160" height="26" rx="13" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="520" y="438" class="pill"><tspan font-weight="700">553</tspan> file deleted</text>

  <!-- level 10 -->
  <rect x="620" y="318" width="160" height="26" rx="13" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="700" y="336" class="pill"><tspan font-weight="700">5712</tspan> SSH brute force</text>
  <rect x="620" y="350" width="160" height="26" rx="13" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="700" y="368" class="pill"><tspan font-weight="700">100200</tspan> lab file modified</text>

  <!-- level 12 -->
  <rect x="740" y="388" width="160" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="820" y="406" class="pill"><tspan font-weight="700">100201</tspan> lab file deleted</text>

  <!-- footnotes -->
  <text x="258" y="482" font-size="13" fill="#3d444d">◀ Left of this line (levels 0–2): the event is processed but NOT saved as an alert.</text>
  <text x="258" y="500" font-size="13" fill="#3d444d">  The manager saves alerts from level 3 up (<tspan class="mono">&lt;log_alert_level&gt;3&lt;/log_alert_level&gt;</tspan> in ossec.conf).</text>
  <text x="40" y="536" font-size="12.5" fill="#57606a">100200 and 100201 are this lab's custom rules (configs/server/local_rules.xml). They raise the level of FIM alerts for /opt/fim-lab.</text>
</svg>
